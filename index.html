emociones que interpretaban los actores, a veces no correspondían con lo que se estaba contando. Entiendo que el mantener una misma emoción a lo largo de todo el relato pierde intensidad e interés. Eché de menos esa atmósfera de misterio y tensión en los personajes con que los escribió Edgar Allan Poe sus cuentos. Veo la necesidad de cuidar la interpretación de los actores, que, bajo mi punto de vista, les costó enganchar al público en la historia. \nEl vestuario podría estar más cuidado. Vi trajes arrugados y de muy mala calidad. El llevar bailarinas blancas con un vestido negro no lo veo apropiado. \nTambién vi que las historias se recortaron. Esto hizo que perdieran ciertos detalles imprescindibles para crear tensión y que se entendieran. De hecho, el poema del cuervo apenas se entendió. Y la historia de el corazón delator se omitieron detalles importantes para enganchar al público.\nEn cuanto a la escenografía la vi correcta. El sonido era bastante bueno y la iluminación correcta.\nPero a pesar de todo, sí sentí que había mucha ilusión puesta en el proyecto y con ganas de seguir haciendo. Creo que el proyecto es muy bonito porque ya no se cuentan historias. Sé que mantener la atención del espectador es muy complejo y contar una historia no es lo mismo que representar un personaje en una obra de teatro al uso. Os animo a que sigáis mejorando porque el proyecto merece la pena.","2","5","210","42811672","602049","Edgar Allan Poe Speakeasy Madrid","140560715","","2026-09-22 10:51:42","td0r7pvf8511itd0r7oqjgujkyt5earo"],["0","*Family (adult)*","*0-30 mins*","","*The interactive / immersive elements*","*Just this once*","","","","","","1","","*Cocktails*","1","1","","","*Cocktail 1*","Los vasos de platico estaban rotos, muy cutres los cockteles y los recogían con la boda de basura abierta , no tienen nada que ver con los cockteles de la publicidad","","5","1","1","","1","Nada, la experiencia ha sido terrible , cara, los actores no habían trabajado el texto, el atrezzo e juego de luces\nNo había caracterización ninguna, ni de la sala, ni del servicio. El escenario era una mesa y un sillón con un cartel molesto en la pantalla gigante que nunca se quitaba. Nada de niebla como en los anuncios, las paredes no se habian molestado ni en decorarlas.\nSe dejaron filas vacias para que pasaran los camareros y al final no las usaban. Había que estirarse en los asientos para que sirvieran las bebidas.\nTodo lo que he mencionado de los cócteles antes.\nLas historias duraban entre 5 y 10 minutos con pausas de hasta 15.\nEl narrador elegido tenía un acento andaluz demasiado marcado como para leer este tipo de historias y no ser distrayente.\nNo se impuso ni un mínimo de etiqueta. Había gente en la sala con camiseta de fúlbol, que sumado a la nula caracterización del servicio y la sala, rompía toda la inmersión.\n\nAbsolutamente terrible. Y toda la gente a nuestro alrededor pensaba igual. Miraban el movil durante las pausas para verificar otra vez el anuncio de Instagram.","1","10","210","70901701","679756","Edgar Allan Poe Speakeasy Sevilla","137300152","","2026-09-22 10:07:11","es7d9ppv6n8rs8gkdyujes7d96bfkj2m"],["10","*Friends*","*0-30 mins*","*45-54*","*The speakeasy setting and atmosphere*","*Just this once*","5","","","","","5","5","*Cocktails*","5","5","*Cocktail 2*","*Flavour*","*Cocktail 1*","It was too sweet","*Herbal or sophisticated*, *Beer or wine*, *Sour or citrus-based*","3","4","3","I didn’t really go with an expectation it was my first speakeasy and I didn’t really know to much about Poe so I actually really enjoyed the narrative of his life at the times his stories were written.","5","I enjoyed it all.  It was really well put together.  The actors were fabulous, the staff were friendly.  It was in a great location to head out afterwards.  The cocktails were yummy.  I just had a great experience.","I wasn’t in the VIP section but looking at the space I thought it was a bit crowded.","5","74","14","35233829","683784","Edgar Allan uena presentación y originales, los asientos eran incómodos en un salón de actos y con historias muyyy cortas, estabas más tiempo esperando los cócteles que escuchando historias","3","10","210","106320608","679756","Edgar Allan Poe Speakeasy Sevilla","145032356","","2026-09-22 17:27:59","80kx8p8vi8m2fzdxq80kx8pe9mbdt53d"],["0","*Partner / Spouse*","*0-30 mins*","*25-34*","FUE UNA DECEPCIÓN ABSOLUTA","*Just this once*","1","","","","","","3","*Cocktails*","1","","","FUE UNA DECEPCIÓN, bebidas AGUADAS servidas en vasos de botellon como si los asistentes fuéramos unos adolescentes. MUY LEJOS del BAR CLANDESTINO que prometían en redes","","⭐ 1/5\n\nDecepción absoluta. La experiencia NO es inmersiva, al menos no en el sentido que transmite la publicidad.\n\nLo que nos encontramos fue básicamente una interpretación de cuatro relatos de Edgar Allan Poe por un par de actores que al parecer están comenzando au carrera. Destaco aquí el papel de la narradora que fue lo mejor de la experiencia. Pero no hay una experiencia inmersiva como tal ni la interacción o puesta en escena que esperábamos después de ver cómo se promociona.\n\nAdemás, los cócteles fueron otra decepción. Se anuncian como una parte importante de la experiencia como un BAR CLANDESTINO, pero las cantidades nos parecieron ridículas y no justifican en absoluto el precio de la entrada. Servidos en vasos de plástico y totalmente aguados. No eran cócteles eran licores. \n\nEl problema no es que la experiencia no nos haya gustado. El problema es que lo que se anuncia genera unas expectativas que, en nuestra experiencia, no se corresponden con lo que realmente recibes.\n\nSalimos con la sensación de haber pagado un precio elevado por algo bastante más sencillo de lo que esperábamos. Si se explicara claramente que se trata de una interpretación de cuatro relatos acompañada de cuatro cócteles, probablemente las expectativas serían muy diferentes.","","1","1","1","*The drink service*, *The interactive / immersive element* /* ── CSV parser ──────────────────────────────────────────── */
function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(inQ){if(ch==='"'&&nx==='"'){cell+='"';i++;}else if(ch==='"')inQ=false;else cell+=ch;}
    else{if(ch==='"')inQ=true;else if(ch===','){row.push(cell);cell="";}
    else if(ch==='\n'||(ch==='\r'&&nx==='\n')){row.push(cell);cell="";if(row.some(c=>c.trim()))rows.push(row);row=[];if(ch==='\r')i++;}
    else cell+=ch;}
  }
  if(cell||row.length){row.push(cell);if(row.some(c=>c.trim()))rows.push(row);}
  return rows;
}

/* ── gauges ──────────────────────────────────────────────── */
const RSEG=[{from:1,to:3.8,color:"#E24B4A"},{from:3.8,to:4.2,color:"#EF9F27"},{from:4.2,to:5,color:"#1D9E75"}];
const CSEG=[{from:1,to:2,color:"#E24B4A"},{from:2,to:2.5,color:"#EF9F27"},{from:2.5,to:3.5,color:"#1D9E75"},{from:3.5,to:4,color:"#EF9F27"},{from:4,to:5,color:"#E24B4A"}];
function v2a(v,mn,mx){return Math.PI-((v-mn)/(mx-mn))*Math.PI;}
function arcD(cx,cy,r,a1,a2){
  const x1=cx+r*Math.cos(a1),y1=cy-r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy-r*Math.sin(a2);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${Math.abs(a2-a1)>Math.PI?1:0} ${a1>a2?1:0} ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function gauge(avgVal,n,segs,mn,mx,endLbls){
  const cx=120,cy=118,r=80,sw=22;
  const paths=segs.map(s=>`<path d="${arcD(cx,cy,r,v2a(s.from,mn,mx),v2a(s.to,mn,mx))}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linecap="butt"/>`).join("");
  const tvs=mx===10?[1,2,4,6,8,9,10]:[1,2,3,4,5];
  const ticks=tvs.map(v=>{const a=v2a(v,mn,mx),tr=r+sw+12;return `<text x="${(cx+tr*Math.cos(a)).toFixed(1)}" y="${(cy-tr*Math.sin(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#bbb">${v}</text>`;}).join("");
  let ndl="";
  if(avgVal!==null){const a=v2a(avgVal,mn,mx),nr=r-sw*.5-3,nx=cx+nr*Math.cos(a),ny=cy-nr*Math.sin(a),deg=(Math.PI-a)*(180/Math.PI)+90;ndl=`<polygon points="0,-10 6,0 -6,0" fill="#555" transform="translate(${nx.toFixed(1)},${ny.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`;}
  const el=endLbls?`<text x="${(cx+(r+sw+30)*Math.cos(Math.PI)).toFixed(1)}" y="${(cy-(r+sw+30)*Math.sin(Math.PI)+12).toFixed(1)}" text-anchor="middle" font-size="9" fill="#bbb">${endLbls[0]}</text><text x="${(cx+(r+sw+30)*Math.cos(0)).toFixed(1)}" y="${(cy-(r+sw+30)*Math.sin(0)+12).toFixed(1)}" text-anchor="middle" font-size="9" fill="#bbb">${endLbls[1]}</text>`:"";
  const as=avgVal!==null?avgVal.toFixed(2):"–";
  return `<svg viewBox="0 0 240 158" width="240" height="158">${paths}${ticks}${ndl}${el}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="28" font-weight="600" fill="#1a1916">${as}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="11" fill="#bbb">${avgVal!==null?`n = ${n}`:"no data"}</text></svg>`;
}

/* ── option parsing (Typeform wraps choice labels in *…*) ──── */
function norm(v){if(!v||!String(v).trim())return null;const s=String(v).trim().replace(/\*/g,"").trim();return s||null;}
function opts(v){
  const s=String(v??"").trim(); if(!s) return {found:[],other:null};
  const found=[...s.matchAll(/\*([^*]+)\*/g)].map(m=>m[1].trim());
  const rest=s.replace(/\*[^*]+\*/g,"").replace(/^[\s,]+|[\s,]+$/g,"").replace(/\s*,\s*,\s*/g,", ").trim();
  return {found, other: rest||null};
}
function catMulti(rows,i){const out=[];rows.forEach(r=>{const o=opts(r[i]);out.push(...o.found);if(o.other)out.push("Other (written in)");});return out;}
function catSingle(rows,i){return rows.map(r=>{const o=opts(r[i]);return o.found[0]||(o.other?"Other (written in)":null);}).filter(Boolean);}
function wrapL(s,n=24){const w=String(s).split(" "),out=[];let cur="";w.forEach(x=>{if((cur+" "+x).trim().length>n&&cur){out.push(cur);cur=x;}else cur=(cur+" "+x).trim();});if(cur)out.push(cur);return out.length>1?out:s;}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ── open text translation ───────────────────────────────── */
async function translateComment(text) {
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const lang = data[2];
    if(lang === 'en') return null;
    const translated = data[0].map(s=>s[0]).join('');
    return translated;
  } catch(e) { return null; }
}

async function translateColumn(btnEl, containerId) {
  btnEl.textContent = 'Translating…';
  btnEl.disabled = true;
  const items = document.querySelectorAll(`#${containerId} .comi`);
  for(const item of items) {
    if(item.dataset.translated) continue;
    const original = item.textContent.trim();
    if(!original) continue;
    const translation = await translateComment(original);
    if(translation) {
      item.innerHTML = `${translation}<div style="font-size:11px;color:var(--faint);margin-top:3px;font-style:italic">${original}</div>`;
    }
    item.dataset.translated = '1';
  }
  btnEl.textContent = 'Translated';
}

/* ── dedupe: one row per token, keep the completed submission ── */
function dedupeByToken(rows){
  const seen={},noTok=[];
  const partial=r=>{const s=String(r[C.sub]||"").trim();return !s||s.includes("0001");};
  rows.forEach(r=>{
    const t=String(r[C.token]||"").trim();
    if(!t){noTok.push(r);return;}
    if(!seen[t]||(partial(seen[t])&&!partial(r)))seen[t]=r;
  });
  return [...Object.values(seen),...noTok];
}

function fillSelect(selId,vals,fn){
  const sel=document.getElementById(selId),cur=sel.value,keep=vals.includes(cur)?cur:"";
  sel.innerHTML=`<option value="">All</option>`+vals.map(v=>`<option value="${v}"${v===keep?" selected":""}>${v}</option>`).join("");
  sel.disabled=vals.length<=1;sel.onchange=fn;
}
function populateFilters(){
  function refresh(first){
    const country=document.getElementById("f-country").value,city=document.getElementById("f-city").value;
    fillSelect("f-country",uniq(ROWS.map(resolveCountry)),()=>refresh());
    const byCountry=country?ROWS.filter(r=>resolveCountry(r)===country):ROWS;
    fillSelect("f-city",uniq(byCountry.map(resolveCity)),()=>refresh());
    const byCity=city?byCountry.filter(r=>resolveCity(r)===city):byCountry;
    fillSelect("f-idp",uniq(byCity.map(r=>clean(r[C.idp]))),()=>{renderDashboard();if(ACTIVE_TAB==="comp")renderComparison();});
    if(!first){renderDashboard();if(ACTIVE_TAB==="comp")renderComparison();}
  }
  refresh(true);
}
function geoFilter(r,withIdp){
  const country=document.getElementById("f-country").value,city=document.getElementById("f-city").value,idp=document.getElementById("f-idp").value;
  if(country&&resolveCountry(r)!==country)return false;
  if(city&&resolveCity(r)!==city)return false;
  if(withIdp&&idp&&clean(r[C.idp])!==idp)return false;
  return true;
}
function filteredRows(){return ROWS.filter(r=>geoFilter(r,true));}

function metricColor(val, type) {
  if(val===null) return '#b8b5ad';
  if(type==='nps')    return val>=50?'#1D9E75':val>=0?'#EF9F27':'#E24B4A';
  if(type==='rec')    return val>=9?'#1D9E75':val>=7?'#EF9F27':'#E24B4A';
  if(type==='centre') {
    // 3 is perfect, green 2.5-3.5, amber 2-2.5 and 3.5-4, red outside
    const d = Math.abs(val - 3);
    return d<=0.5?'#1D9E75':d<=1?'#EF9F27':'#E24B4A';
  }
  // standard 1-5 higher is better
  return val>=4.2?'#1D9E75':val>=3.8?'#EF9F27':'#E24B4A';
}


  function relColor(val, allVals, isCentre, isNps, isRec) {
    if(val===null) return {bg:'transparent',fg:'var(--faint)'};
    const valid=allVals.filter(v=>v!==null);
    if(valid.length<2) return {bg:'var(--bg)',fg:'var(--text)'};

    // Absolute thresholds
    function isGood(v)  {
      if(isCentre) return Math.abs(v-3)<=0.5;
      if(isNps)    return v>=50;
      if(isRec)    return v>=8;   // 8-10 = green
      return v>=4.2;
    }
    function isOk(v) {
      if(isCentre) return Math.abs(v-3)<=1;
      if(isNps)    return v>=0;
      if(isRec)    return v>=6;   // 6-7 = amber
      return v>=3.8;
    }

    const anyGood  = valid.some(isGood);
    const anyBad   = valid.some(v=>!isOk(v));

    // Relative score within group
    const score = v => isCentre ? -Math.abs(v-3) : v;
    const scores = valid.map(score);
    const mn=Math.min(...scores), mx=Math.max(...scores);
    const t = mx===mn ? 0.5 : (score(val)-mn)/(mx-mn); // 0=worst, 1=best

    let r,g,b;
    if(!anyGood) {
      // All bad -- red spectrum only (dark red to light red)
      const u = t; // 0=darkest red, 1=lightest red
      r=Math.round(180+u*30); g=Math.round(60+u*80); b=Math.round(60+u*80);
    } else if(!anyBad) {
      // All good -- green spectrum only (light green to dark green)
      const u = t;
      r=Math.round(130-u*100); g=Math.round(150+u*50); b=Math.round(100+u*17);
    } else {
      // Mixed -- full red/amber/green but capped by absolute threshold
      if(isGood(val)) {
        // Green zone: lightest green (just above threshold) to darkest green (best)
        const greenVals = valid.filter(isGood);
        const gScores = greenVals.map(score);
        const gMn=Math.min(...gScores), gMx=Math.max(...gScores);
        const gt = gMx===gMn ? 1 : (score(val)-gMn)/(gMx-gMn);
        r=Math.round(100-gt*70); g=Math.round(158+gt*42); b=Math.round(100+gt*17);
      } else if(isOk(val)) {
        // Amber zone
        r=239; g=159; b=39;
      } else {
        // Red zone: light red (just below ok) to dark red (worst)
        const badVals = valid.filter(v=>!isOk(v));
        const bScores = badVals.map(score);
        const bMn=Math.min(...bScores), bMx=Math.max(...bScores);
        const bt = bMx===bMn ? 0 : (score(val)-bMn)/(bMx-bMn);
        r=Math.round(220-bt*40); g=Math.round(80+bt*40); b=Math.round(74+bt*40);
      }
    }
    const brightness = 0.299*r + 0.587*g + 0.114*b;
    const fg = brightness < 140 ? '#fff' : '#333';
    return {bg:`rgb(${r},${g},${b})`,fg};
  }

  function fmtVal(val, isNps) {
    if(val===null) return '–';
    if(isNps) return (val>0?'+':'')+val;
    return val.toFixed(1);
  }

const metricDefs=[
  {key:"nps",label:"NPS",isNps:true},{key:"rec",label:"Rec /10",isRec:true},
  {key:"overall",label:"Overall"},{key:"vfm",label:"VFM /5"},{key:"exp",label:"Expectations"},{key:"ret",label:"Return"},
  {key:"venue",label:"Venue"},{key:"actors",label:"Actors"},{key:"script",label:"Script"},
  {key:"cSvc",label:"Cocktail svc"},{key:"cQual",label:"Cocktail quality"},{key:"duration",label:"Duration",centre:true},
];
function renderComparison(){
  const MIN_N=10;
  const planRows={};
  ROWS.forEach(r=>{if(!geoFilter(r,false))return;const idp=clean(r[C.idp]);if(!idp||idp==="xxxxx")return;(planRows[idp]=planRows[idp]||[]).push(r);});
  function planMetrics(rows){
    const n=i=>rows.map(r=>tryNum(r[i])).filter(v=>v!==null);
    const rn=n(C.rec),pro=rn.filter(v=>v>=9).length,det=rn.filter(v=>v<=6).length;
    const m={nps:rn.length?Math.round(((pro-det)/rn.length)*100):null,rec:avg(rn),count:rows.length};
    ["overall","vfm","exp","ret","venue","actors","script","cSvc","cQual","duration"].forEach(k=>m[k]=avg(n(C[k])));
    return m;
  }
  const allPlans=Object.entries(planRows).map(([idp,rows])=>({idp,city:PLAN_MAP[idp]||(rows[0][C.p]||idp),m:planMetrics(rows),lowN:rows.length<MIN_N}));
  if(!allPlans.length){document.getElementById("comparison").innerHTML='<p style="padding:40px;color:var(--muted);text-align:center">No data.</p>';return;}
  window._compSort=window._compSort||{key:"nps",dir:-1};
  window._compActive=window._compActive||new Set(metricDefs.map(m=>m.key));
  const score=(met,v)=>met&&met.centre?-Math.abs(v-3):v;
  function sortPlans(){
    const {key,dir}=window._compSort,met=metricDefs.find(m=>m.key===key);
    allPlans.sort((a,b)=>{
      if(key==="city")return a.city.localeCompare(b.city)*dir;
      const av=key==="count"?a.m.count:a.m[key],bv=key==="count"?b.m.count:b.m[key];
      if(av===null&&bv===null)return 0;if(av===null)return 1;if(bv===null)return -1;
      return ((score(met,av)-score(met,bv))*dir)||((b.m.rec??0)-(a.m.rec??0));
    });
  }
  function vsOthers(plan,pool){
    return metricDefs.filter(m=>!m.isNps&&!m.isRec).map(m=>{
      const val=plan.m[m.key];if(val===null)return null;
      const ov=pool.filter(p=>p.idp!==plan.idp).map(p=>p.m[m.key]).filter(v=>v!==null);if(!ov.length)return null;
      const oa=ov.reduce((a,b)=>a+b,0)/ov.length;
      const scale=m.isNps?10:m.isRec?2:1; // compare NPS/rec on comparable footing
      return {label:m.label,diff:(m.centre?(Math.abs(oa-3)-Math.abs(val-3)):(val-oa))/scale};
    }).filter(Boolean);
  }
  const fmtCity=p=>p.city.split(" (")[0];
  function insightBlock(){
    const full=[...allPlans].filter(p=>!p.lowN).sort((a,b)=>((b.m.nps??-999)-(a.m.nps??-999))||((b.m.rec??0)-(a.m.rec??0)));
    if(full.length<2)return "";
    const lines=[],top=full[0],bottom=full[full.length-1];
    const strengths=vsOthers(top,full).filter(s=>s.diff>0.2).sort((a,b)=>b.diff-a.diff).slice(0,3).map(s=>s.label);
    const tie=full[1]&&full[1].m.nps===top.m.nps?`, level on NPS with ${fmtCity(full[1])} but ahead on Rec /10 (${top.m.rec.toFixed(1)} vs ${full[1].m.rec.toFixed(1)})`:"";
    lines.push(`<strong>${fmtCity(top)}</strong> leads with an NPS of ${top.m.nps>0?"+":""}${top.m.nps} (n = ${top.m.count})${tie}${strengths.length?". It scores above the other cities on "+strengths.join(", "):""}.`);
    const weak=vsOthers(bottom,full).filter(s=>s.diff<-0.2).sort((a,b)=>a.diff-b.diff).slice(0,3).map(s=>s.label);
    lines.push(`<strong>${fmtCity(bottom)}</strong> has the lowest NPS at ${bottom.m.nps>0?"+":""}${bottom.m.nps} (n = ${bottom.m.count})${weak.length?", with the biggest gaps in "+weak.join(", "):""}.`);
    const mean=k=>{const v=full.map(p=>p.m[k]).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
    const sysWeak=metricDefs.filter(m=>{const mv=mean(m.key);if(mv===null)return false;if(m.centre)return Math.abs(mv-3)>0.6;if(m.isNps)return mv<0;if(m.isRec)return mv<7;return mv<3.8;}).map(m=>m.label);
    if(sysWeak.length)lines.push(`Across all cities, <strong>${sysWeak.join("</strong>, <strong>")}</strong> ${sysWeak.length===1?"scores":"score"} below target. This points to a product-level issue rather than a local one.`);
    const sysStrong=metricDefs.filter(m=>{const mv=mean(m.key);if(mv===null)return false;if(m.centre)return false;if(m.isNps)return mv>=50;if(m.isRec)return mv>=8;return mv>=4.2;}).map(m=>m.label);
    if(sysStrong.length)lines.push(`<strong>${sysStrong.join("</strong>, <strong>")}</strong> ${sysStrong.length===1?"is":"are"} consistently strong across cities.`);
    const dAll=full.flatMap(p=>planRows[p.idp].map(r=>tryNum(r[C.duration]))).filter(v=>v!==null);
    if(dAll.length){const sh=Math.round(dAll.filter(v=>v<=2).length/dAll.length*100),lg=Math.round(dAll.filter(v=>v>=4).length/dAll.length*100);
      if(sh>=25)lines.push(`Duration averages close to 3, but that hides a split: <strong>${sh}%</strong> felt it was too short vs ${lg}% too long.`);}
    const rel=metricDefs.filter(m=>!m.isNps&&!m.isRec&&!m.centre).map(m=>({l:m.label,v:mean(m.key)})).filter(x=>x.v!==null).sort((a,b)=>b.v-a.v);
    if(rel.length>=2)lines.push(`Strongest dimension overall is <strong>${rel[0].l}</strong> (${rel[0].v.toFixed(1)}/5 city average); weakest is <strong>${rel[rel.length-1].l}</strong> (${rel[rel.length-1].v.toFixed(1)}/5).`);
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px">Highlights</div>
      <ul style="list-style:none;display:flex;flex-direction:column;gap:10px">${lines.map(l=>`<li style="font-size:13px;line-height:1.6;color:var(--text);padding-left:16px;position:relative"><span style="position:absolute;left:0;color:var(--faint)">·</span>${l}</li>`).join("")}</ul>
    </div>`;
  }
  function fmtVal(v,isNps){if(v===null)return "–";if(isNps)return (v>0?"+":"")+v;return v.toFixed(1);}
  function drawTable(){
    const act=metricDefs.filter(m=>window._compActive.has(m.key)),sk=window._compSort.key,sd=window._compSort.dir;
    const arrow=k=>sk===k?(sd===-1?"↓":"↑"):"⇅";
    let t=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;align-items:center"><span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:4px">Show:</span>`;
    metricDefs.forEach(m=>{const on=window._compActive.has(m.key);t+=`<button onclick="window._compToggle('${m.key}')" style="font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid ${on?"var(--text)":"var(--border)"};background:${on?"var(--text)":"var(--surface)"};color:${on?"var(--surface)":"var(--muted)"};cursor:pointer">${m.label}</button>`;});
    t+=`</div><div style="overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="border-bottom:2px solid var(--border)">
      <th class="sort-th" style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap" onclick="window._compSetSort('city')">City <span style="color:var(--faint);font-size:10px">${arrow("city")}</span></th>
      <th class="sort-th" style="text-align:center;padding:10px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)" onclick="window._compSetSort('count')">n <span style="color:var(--faint);font-size:10px">${arrow("count")}</span></th>`;
    act.forEach(m=>{const a=sk===m.key;t+=`<th class="sort-th" style="text-align:center;padding:10px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:${a?"var(--text)":"var(--muted)"};white-space:nowrap" onclick="window._compSetSort('${m.key}')">${m.label} <span style="font-size:10px;color:${a?"var(--text)":"var(--faint)"}">${arrow(m.key)}</span></th>`;});
    t+=`</tr></thead><tbody>`;
    allPlans.forEach(p=>{
      const country=(p.city.match(/\(([^)]+)\)/)||[])[1]||"";
      t+=`<tr style="border-bottom:1px solid var(--border);opacity:${p.lowN?"0.4":"1"}"><td style="padding:10px 14px;font-weight:500;white-space:nowrap">${fmtCity(p)}${p.lowN?' <span style="font-size:10px;color:var(--faint);font-weight:400">low n</span>':""}<br><span style="font-size:11px;color:var(--faint);font-weight:400">${country}${BRAND_NOTE[p.idp]?" · Serial Killer brand":""} · ${p.idp}</span></td><td style="padding:10px 8px;text-align:center;color:var(--muted);font-size:12px">${p.m.count}</td>`;
      act.forEach(m=>{const v=p.m[m.key];const {bg,fg}=relColor(v,allPlans.map(q=>q.m[m.key]),!!m.centre,!!m.isNps,!!m.isRec);t+=`<td style="padding:10px 8px;text-align:center;font-weight:600;background:${bg};color:${fg};${sk===m.key?"outline:2px solid rgba(0,0,0,0.15);outline-offset:-2px":""}">${fmtVal(v,m.isNps)}</td>`;});
      t+=`</tr>`;
    });
    t+=`</tbody></table></div><div style="font-size:11px;color:var(--muted);text-align:right;margin-top:10px">Click any column header to sort · greyed rows = fewer than ${MIN_N} responses · Duration: 3 = just right</div>`;
    document.getElementById("comp-table-area").innerHTML=t;
  }
  window._compSetSort=k=>{if(window._compSort.key===k)window._compSort.dir*=-1;else window._compSort={key:k,dir:-1};sortPlans();drawTable();};
  window._compToggle=k=>{const s=window._compActive;if(s.has(k)){if(s.size>1)s.delete(k);}else s.add(k);drawTable();};
  sortPlans();
  document.getElementById("comparison").innerHTML=insightBlock()+'<div id="comp-table-area"></div>';
  drawTable();
}
</script>
</body>
</html>
